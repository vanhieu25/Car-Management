[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings = ignore::DeprecationWarning

markers =
    simple: Simple SELECT query (< 50ms)
    join_agg: JOIN + aggregation query (< 200ms)
    report: Report query (< 500ms)
    wf01: Workflow 01 (Nhập kho) integration test
    wf02: Workflow 02 (Bán xe chuẩn) integration test
    wf03: Workflow 03 (Bán trả góp) integration test
    wf04: Workflow 04 (Bảo hành) integration test
    wf05: Workflow 05 (Bảo dưỡng) integration test
    wf06: Workflow 06 (Khiếu nại) integration test
    wf07: Workflow 07 (Marketing→Lead→KH) integration test
    wf08: Workflow 08 (Hủy hợp đồng) integration test
    perf: Performance benchmark test